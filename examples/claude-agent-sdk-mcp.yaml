# claude-agent-sdk + MCP servers, with no built-in tools
#
# Runs an agent whose ONLY tools are the MCP servers this workflow declares.
# It has no built-in Claude Code tools at all -- no filesystem, no shell, no
# web fetch -- because it omits `tools:` and the provider's `native_tools`
# setting is left at its secure default, `none`.
#
# How it works:
#   - Conductor translates each `mcp_servers:` entry into the SDK's own
#     `McpStdioServerConfig` / `McpHttpServerConfig` / `McpSSEServerConfig`
#     shape and hands it to `ClaudeAgentOptions`.
#   - The config is written to a private (0600) temp file and passed by path,
#     so resolved `env` values and `Authorization` headers never appear in the
#     `claude` CLI's command line (visible via /proc/<pid>/cmdline otherwise).
#   - `strict_mcp_config` is always enabled, so an ambient project `.mcp.json`
#     or a user-global MCP setting cannot inject servers this workflow never
#     declared. Servers must be declared here to be reachable.
#   - With no built-in tools the session runs under the `dontAsk` permission
#     mode, which denies anything not pre-approved, and each declared server is
#     pre-approved by exactly one server-scoped rule: `mcp__web-search__*`.
#     Nothing broader (no `*`, no `mcp__*`) is ever granted.
#
# Limitations of this mode:
#   - An MCP tool that requires interactive user approval may be denied under
#     `dontAsk` rather than prompting. That is deliberate: a workflow run has
#     nobody to answer a prompt, and the alternative is `bypassPermissions`.
#   - Server names must use only letters, digits, '-' and single '_'
#     characters (not leading or trailing), since they are embedded in a
#     `__`-delimited permission rule. A '.' is refused too: the CLI rewrites
#     it to '_' when building tool names, so a dotted rule never matches.
#     Anything else is refused, not rewritten.
#
# Carve-outs that apply to this provider in every mode:
#   - Per-server `tools:` filters are refused (the SDK's MCP config has no
#     equivalent field, and ignoring a filter would grant MORE tools than
#     declared). Use `tools: ["*"]`, which is the default.
#   - Per-agent `tools:` allowlists are refused
#     (`workflow_tools_passthrough=False`), and an explicit `tools: []` next to
#     `mcp_servers:` is refused too: it would claim "no tools" while every MCP
#     tool stays attached. Omit `tools:` as below.
#
# To ALSO give the agent the built-in filesystem/shell/web tools, set
# `runtime.provider.native_tools: claude_code`. That grants them with automatic
# approval, and `working_dir` is not a sandbox.
#
# Pre-requisites:
#   pip install conductor[claude-agent-sdk]
#   # Plus the `claude` CLI:
#   npm install -g @anthropic-ai/claude-code
#   claude login
#   # The MCP server below is fetched on demand by npx (Node.js required).
#
# Usage:
#   conductor run examples/claude-agent-sdk-mcp.yaml \
#     --input question="What changed in the Python 3.13 release?"
#
# Validation only (no execution / no API calls):
#   conductor validate examples/claude-agent-sdk-mcp.yaml

workflow:
  name: claude-agent-sdk-mcp
  description: >
    Research agent running on the experimental claude-agent-sdk provider with
    a custom MCP search server as its only tool — no built-in Claude Code
    tools, under the secure `native_tools: none` default.
  entry_point: researcher

  runtime:
    # The bare shorthand resolves to `native_tools: none`.
    provider: claude-agent-sdk
    default_model: claude-sonnet-4-5
    max_agent_iterations: 20

    mcp_servers:
      web-search:
        type: stdio
        command: npx
        args: ["-y", "open-websearch@latest"]
        env:
          MODE: stdio
        # Must stay ["*"] for this provider: a narrowing filter has no SDK
        # equivalent and is refused at provider construction.
        tools: ["*"]

  limits:
    max_iterations: 5
    timeout_seconds: 600

agents:
  - name: researcher
    description: Researches a question using only the MCP search server
    # NOTE: no `tools:` here on purpose. Omitting it lets `native_tools: none`
    # apply (no built-ins) while the MCP server above stays reachable.
    # `tools: []` would be refused alongside `mcp_servers:`, and a non-empty
    # allowlist is refused on this provider.
    prompt: |
      Research the following question and report what you find.

      Question: {{ workflow.input.question }}

      Use the web-search MCP tools for current information. You have no other
      tools: do not try to read local files or run commands.
    output:
      answer:
        type: string
        description: A concise answer to the question
      sources:
        type: array
        description: URLs or references supporting the answer
        items:
          type: string
    routes:
      - to: $end

output:
  answer: "{{ researcher.output.answer }}"
  sources: "{{ researcher.output.sources }}"
