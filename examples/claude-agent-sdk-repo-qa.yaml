# Repo Q&A with the claude-agent-sdk provider (`native_tools: claude_code`)
#
# This single-agent workflow asks the claude-agent-sdk provider to READ a file
# in its working directory and answer a question about it. Reading a file needs
# the built-in Claude Code tools, so the workflow opts in to them explicitly
# with `runtime.provider.native_tools: claude_code`.
#
# WHY THE OPT-IN IS EXPLICIT:
#   An agent that omits `tools:` gets NO built-in tools by default
#   (`native_tools: none`): no filesystem, no shell, no web. That default used
#   to be the opposite — omitting `tools:` silently granted the full preset —
#   which made every agent on this provider a filesystem/shell/web agent
#   without the workflow ever saying so. `claude_code` grants the full preset
#   (Read / Bash / Edit / Glob / Grep / WebFetch / ...) with permissions
#   approved automatically, exactly like the bare `claude` CLI.
#
#   `working_dir` only decides where relative paths resolve; it is NOT a
#   sandbox. Run this only where the workflow is trusted with the machine.
#
# WHY THIS EXAMPLE ALSO GUARDS A BUG:
#   The executor's resolve_agent_tools() turns an omitted `tools:` into an
#   empty list (this workflow declares no workflow-level `tools:` to inherit),
#   so the provider cannot tell it apart from an explicit `tools: []` by that
#   list alone. It inspects the raw `agent.tools` field instead: an OMITTED
#   `tools:` here gets the preset, while an explicit `tools: []` would still
#   disable every built-in tool even under `claude_code`.
#
# Pre-requisites:
#   pip install conductor[claude-agent-sdk]      # or: uv add 'claude-agent-sdk>=0.2.82'
#   npm install -g @anthropic-ai/claude-code     # the `claude` CLI
#   claude login
#
# Usage (run from the repo root so README.md is in the working directory):
#   conductor run examples/claude-agent-sdk-repo-qa.yaml \
#     --input question="In one sentence, what is Conductor?"
#
# Validation only (no execution / no API calls):
#   conductor validate examples/claude-agent-sdk-repo-qa.yaml

workflow:
  name: claude-agent-sdk-repo-qa
  description: >
    Single claude-agent-sdk agent that reads a file in its working
    directory and answers a question about it, using the built-in
    claude_code tools the workflow opts in to with `native_tools`.
  version: "1.0.0"
  entry_point: repo_reader

  runtime:
    provider:
      name: claude-agent-sdk
      # Explicit opt-in to the built-in Claude Code tools. Without it an agent
      # that omits `tools:` gets none, and could not read README.md.
      native_tools: claude_code
    # claude-sonnet-4-5 is the SDK's documented default; adjust to whatever
    # your Claude Code backend (anthropic.com / Vertex AI / Bedrock) expects.
    default_model: claude-sonnet-4-5

  input:
    question:
      type: string
      required: true
      description: A question to answer using a file in the working directory.

agents:
  - name: repo_reader
    description: Read README.md in the working directory and answer the question.
    # NOTE: there is intentionally NO `tools:` field here. Omitting it lets the
    # workflow-level `native_tools: claude_code` apply (Read/Bash/Edit/...).
    # `tools: []` would disable every built-in tool regardless.
    prompt: |
      Read the file README.md in your current working directory, then answer
      the following question using only what that file says. Cite the relevant
      phrase from the file.

      Question: {{ workflow.input.question }}
    output:
      answer:
        type: string
        description: The answer, grounded in README.md.
      evidence:
        type: string
        description: A short quote from README.md that supports the answer.
    routes:
      - to: $end

output:
  answer: "{{ repo_reader.output.answer }}"
  evidence: "{{ repo_reader.output.evidence }}"
